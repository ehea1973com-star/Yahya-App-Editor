name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip Project
        run: unzip YahyaAppEditor.zip -d .
      - name: Build with Gradle
        run: |
          cd YahyaAppEditor/YahyaAppEditor
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: YahyaAppEditor/YahyaAppEditor/app/build/outputs/apk/release/app-release-unsigned.apk
